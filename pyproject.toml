[project]
name = "es-index-explorer"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "elasticsearch~=9.2",
    "requests>=2.33.0",
    "pydantic>=2.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["es_index_explorer"]

[[tool.uv.index]]
name = "ai-pypi-anthology"
url = "https://relativityone.jfrog.io/artifactory/api/pypi/ai-pypi-anthology/simple"
default = true
