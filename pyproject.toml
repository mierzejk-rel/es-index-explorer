[project]
name = "es-index-explorer"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "elasticsearch~=9.4.1",
    "requests>=2.33.0",
    "pydantic>=2.0",
    "rich>=13.7.0",
    # torch and torchvision are declared directly (and pinned to the CPU-only index below) so no
    # CUDA/nvidia-* runtime is pulled in. torchvision is needed because transformers' lazy loader
    # for the Aria vision model is triggered during skops (a wtpsplit dep) scipy introspection.
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.0",
    "sentence-transformers>=5.0",
    "wtpsplit>=2.1",
    "spacy>=3.7",
]

[project.scripts]
question-suitability = "es_index_explorer.question_analysis.cli:entrypoint"

[dependency-groups]
analysis = [
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "stanza>=1.14.0",
    "statsmodels>=0.14.6",
]
analysis-test = [
    { include-group = "dev" },
    "ruff>=0.16.3",
    "ty>=0.0.73",
]
annotation = [
    "cursor-sdk>=1.0.28",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
mlflow = [
    "mlflow-skinny>=3.15.1",
    "pandas>=3.0.3",
    "pyarrow>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["es_index_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast, dependency-free unit tests",
    "integration: tests requiring external models/services (skipped by default)",
]

[tool.coverage.run]
source = ["es_index_explorer"]
branch = true

[[tool.uv.index]]
name = "ai-pypi-anthology"
url = "https://relativityone.jfrog.io/artifactory/api/pypi/ai-pypi-anthology/simple"
default = true

# CPU-only PyTorch: resolve torch from PyTorch's CPU wheel index so no CUDA/nvidia-* packages
# are pulled in (this deployment has no GPU/MPS/NPU). 'explicit' means this index is used only
# for packages mapped to it via [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
