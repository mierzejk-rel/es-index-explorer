[project]
name = "es-index-explorer"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "elasticsearch~=9.4.1",
    "requests>=2.33.0",
    "pydantic>=2.0",
    "rich>=13.7.0",
    # torch is declared directly (and pinned to the CPU-only index below) so the CUDA/nvidia-*
    # runtime is not pulled in for this CPU-only deployment. It is otherwise a transitive dep of
    # sentence-transformers / wtpsplit.
    "torch>=2.2",
    "sentence-transformers>=3.0",
    "wtpsplit>=2.1",
    "spacy>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["es_index_explorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: fast, dependency-free unit tests",
    "integration: tests requiring external models/services (skipped by default)",
]

[tool.coverage.run]
source = ["es_index_explorer"]
branch = true

[[tool.uv.index]]
name = "ai-pypi-anthology"
url = "https://relativityone.jfrog.io/artifactory/api/pypi/ai-pypi-anthology/simple"
default = true

# CPU-only PyTorch: resolve torch from PyTorch's CPU wheel index so no CUDA/nvidia-* packages
# are pulled in (this deployment has no GPU/MPS/NPU). 'explicit' means this index is used only
# for packages mapped to it via [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
